name: EvoNet Knowledge Ingestion (Pinecone)

on:
  workflow_run:
    workflows: ["EvoNet CVE Pipeline"]
    types:
      - completed
  workflow_dispatch:

jobs:
  feed_the_brain:
    name: Feed Pinecone Vector DB
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pinecone python-dotenv

      - name: Download pipeline data
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: cve-data-stage-2
          path: data/
        continue-on-error: true

      - name: Ingest CVE data into Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: python app/scripts/pinecone_ingest.py
